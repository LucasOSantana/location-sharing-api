services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: usernamelocalqueue
      RABBITMQ_DEFAULT_PASS: passwordlocalqueue
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  location-sharing-api:
    build: .
    container_name: location-sharing-api
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: usernamelocalqueue
      SPRING_RABBITMQ_PASSWORD: passwordlocalqueue
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data: